<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>接受 GitHub 協作邀請</title>
<style>
  * { box-sizing: border-box; }
  html, body { width:1280px; height:800px; margin:0; overflow:hidden;
    font-family:"Segoe UI","Microsoft JhengHei",sans-serif; color:#1f2328; }
  body { background:#e8eaed; padding:22px; }
  .page { position:relative; width:1236px; height:756px; border-radius:14px; overflow:hidden;
    background:#f6f8fa; border:1px solid #aeb4bc; box-shadow:0 16px 40px rgba(28,35,45,.18); }
  .ghbar { height:60px; background:#24292f; display:flex; align-items:center; padding:0 22px; gap:16px; }
  .ghlogo { width:34px; height:34px; border-radius:50%; background:#fff; }
  .search { flex:0 0 320px; height:32px; border-radius:7px; background:#32383f; border:1px solid #444c56; }
  .spacer { flex:1; }
  .bell { position:relative; width:34px; height:34px; border-radius:50%; background:#32383f;
    display:flex; align-items:center; justify-content:center; font-size:17px; color:#cdd5dd;
    box-shadow:0 0 0 3px #24292f, 0 0 0 6px #ff5252; }
  .bell .dotb { position:absolute; top:4px; right:5px; width:9px; height:9px; border-radius:50%; background:#2f81f7; }
  .avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#8ab4f8,#f28b82); }
  .invite { width:640px; margin:120px auto 0; background:#fff; border:1px solid #d0d7de;
    border-radius:12px; padding:36px 40px; text-align:center; }
  .repoavatar { width:64px; height:64px; border-radius:12px; margin:0 auto 14px;
    background:linear-gradient(135deg,#0e7c7b,#0a5958); }
  .invite h2 { margin:0 0 6px; font-size:21px; }
  .invite .who { color:#57606a; font-size:15px; margin-bottom:26px; }
  .btn { display:inline-block; background:#1f883d; color:#fff; font-weight:700;
    font-size:16px; padding:11px 26px; border-radius:8px;
    box-shadow:0 0 0 4px #fff, 0 0 0 7px #0a5958; }
  .decline { display:inline-block; margin-left:12px; color:#57606a; font-size:15px; padding:11px 12px; }
  /* 標註 */
  .ring { position:absolute; border:3px solid #ff5252; border-radius:50%; z-index:5; }
  .note { position:absolute; z-index:6; font-size:16px; font-weight:700; padding:6px 12px; border-radius:8px; }
  .n1 { top:74px; right:150px; color:#8f2323; background:#ffe3e3; }
  .ringbtn { position:absolute; border:3px solid #1f883d; border-radius:12px; z-index:5; }
  .n2 { color:#0f5323; background:#dcffe4; }
  .n3 { position:absolute; left:50%; transform:translateX(-50%); bottom:96px; z-index:6;
    color:#374151; background:#fff8e1; border:1px solid #e6d9a8; border-radius:8px;
    padding:10px 16px; font-size:15px; max-width:760px; text-align:center; }
</style>
</head>
<body>
  <div class="page">
    <div class="ghbar">
      <div class="ghlogo"></div>
      <div class="search"></div>
      <div class="spacer"></div>
      <div class="bell">🔔<span class="dotb"></span></div>
      <div class="avatar"></div>
    </div>
    <div class="note n1">邀請通知在這顆鈴鐺（也會寄到信箱）</div>
    <div class="invite">
      <div class="repoavatar"></div>
      <h2>advisor-account／thesis-pair-03</h2>
      <div class="who">advisor-account invited you to collaborate<br>（邀請你成為協作者）</div>
      <span class="btn">Accept invitation</span><span class="decline">Decline</span>
    </div>
    <div class="note n2" style="top:508px; left:50%; transform:translateX(-110px);">↑ 親自按這顆綠色按鈕</div>
    <div class="n3">找不到通知？直接打開教授回報的 repo 網址，同一顆「Accept invitation」綠鈕也會出現在頁面上方。</div>
  </div>
</body>
</html>
